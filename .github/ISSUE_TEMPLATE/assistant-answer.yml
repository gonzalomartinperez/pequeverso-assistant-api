name: Wrong assistant answer
description: The shopping assistant answered incorrectly. Use a synthetic reproduction only.
labels: ["bug", "assistant-quality"]
body:
  - type: markdown
    attributes:
      value: |
        Write the question yourself as a made-up example. Never paste a real conversation, customer data,
        e-mail addresses or secrets. Security issues go through private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Synthetic question
      description: The question text, written by you, that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected answer
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual answer
    validations:
      required: true
  - type: input
    id: catalog-item
    attributes:
      label: Catalog item (if relevant)
      placeholder: Product name or catalog id
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: checkboxes
    id: no-private-data
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real conversation, customer data, e-mail addresses or secrets.
          required: true
