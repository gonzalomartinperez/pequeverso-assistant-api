# One weekly Dependabot PR for every ecosystem (multi-ecosystem group `weekly-all`), Monday 09:00 ART,
# targeting develop. Security-update PRs are disabled in the repository settings; alerts stay on and
# criticals ride the weekly PR. See docs/dependency-updates.md. Every merge remains manual.
version: 2
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1
    labels: [dependencies]
updates:
  - package-ecosystem: uv
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directories:
      - /infra/docker/app
      - /infra/docker/postgres
      - /infra/docker/neo4j
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(docker)
