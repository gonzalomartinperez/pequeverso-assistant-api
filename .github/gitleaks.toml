# Secret scanning for CI (gitleaks; see the `secrets` job). Default rules plus one narrow
# exception: generated contract manifests list sha256 digests of artifact files and pinned git
# commit ids, which the generic-api-key rule reports. The exception matches the whole line, so it
# only covers `"<artifact>.json|.sse": "<64 hex>"` and `"<..._commit|..._sha256>": "<40/64 hex>"`
# entries; any other value on any other line is still reported.
title = "repository secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Artifact digests and commit ids in generated contract manifests"
regexTarget = "line"
regexes = [
  '''^\s*"[A-Za-z0-9_./-]+\.(json|sse)":\s*"[0-9a-f]{64}",?\s*$''',
  '''^\s*"[a-z_]*(commit|revision|sha256)":\s*"([0-9a-f]{40}|[0-9a-f]{64})",?\s*$''',
]
