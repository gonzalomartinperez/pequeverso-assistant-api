name: Branch policy

# Required status on main and develop: enforces the branch flow in scripts/branch_policy.py.
# pull_request_target (workflow file read from the default branch) so a PR cannot edit its own
# gate; only the base commit's policy script is checked out and nothing from the PR runs.
# Branch names reach the script through environment variables, never through the shell.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run
    types: [opened, reopened, synchronize, edited]

permissions: {}

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout trusted policy (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/branch_policy.py
          sparse-checkout-cone-mode: false
      - name: Check branch flow
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/branch_policy.py
