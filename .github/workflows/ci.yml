name: ci

# Entry point on the engineering-standards E1 template (ecosystem 6.0/6.1). `classify` reads
# .github/ci-profile.json and selects the jobs; `ci-gate` is the single fail-closed aggregate.
# `checks` is a temporary alias of `ci-gate` for the current ruleset (remove after PVA-D11).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  # PRs: one run per ref, newer pushes cancel older runs. Other events: one group per commit.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: 0.13.7 # keep equal to the uv image in infra/docker/app/Dockerfile
  AI_PROVIDER: fixture
  ALLOW_PAID_AI: "false"
  LANGSMITH_TRACING: "false"

jobs:
  classify:
    uses: gonzalomartinperez/engineering-standards/.github/workflows/classify.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
      pull-requests: read

  docs:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'docs')
    uses: gonzalomartinperez/engineering-standards/.github/workflows/docs.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
    with:
      readme-check: false # true once README.md follows the ecosystem template
      # Dated evidence records under docs/verification are preserved as written.
      lychee-args: "--offline --no-progress --include-fragments --exclude-path docs/verification './**/*.md'"

  security:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'security')
    uses: gonzalomartinperez/engineering-standards/.github/workflows/security.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
      pull-requests: read
    with:
      dependency-review: true # public repository
      # The local `secrets` job runs gitleaks with .github/gitleaks.toml and its reviewed ignores;
      # the shared job cannot read that path, so it would report the known false positives.
      gitleaks: false
      # Default allow-list plus the ADR-0015 exceptions (psycopg, LGPL-3.0, runtime, unmodified;
      # BSD-2-Clause-Views, a permissive BSD variant used by grimp, dev-only via import-linter).
      allow-licenses: "MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, BSD-3-Clause-Clear, ISC, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0, PSF-2.0, Zlib, MPL-2.0, LGPL-3.0-only, LGPL-3.0-or-later"

  workflows:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'workflows')
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind reviewed source and configuration
        run: python3 -m scripts.ci_identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  secrets:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'secrets')
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reviewed source and configuration
        run: python3 -m scripts.ci_identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: gitleaks over the full history (redacted; fails on zero commits scanned)
        run: .github/scripts/secret-scan.sh

  static:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'static')
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind reviewed source and configuration
        run: python3 -m scripts.ci_identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Ratchets and prompt lock (only tighten, also against the base revision)
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$CI_BASE_SHA" ] && git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"; then
            uv run python -m scripts.ruff_ratchet --base=FETCH_HEAD
            uv run python -m scripts.prompt_lock --base=FETCH_HEAD
            uv run python -m scripts.complexity_ratchet --base=FETCH_HEAD
          else
            echo "::warning title=ratchets::base revision unavailable; checked the tree only"
            uv run python -m scripts.ruff_ratchet
            uv run python -m scripts.prompt_lock
            uv run python -m scripts.complexity_ratchet
          fi
      - name: Import contracts (import-linter, warn mode until PVA-M4.7)
        run: uv run lint-imports
      - name: Dead code (vulture)
        run: uv run vulture
      - name: Validate paired skill discovery
        run: uv run python -m scripts.validate_skills
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pyrefly second type checker (report only, non-blocking until PVA-M4.10)
        run: |
          uvx pyrefly@1.4.1 check app contracts scripts --python-interpreter-path .venv/bin/python \
            || echo "::warning title=pyrefly::findings reported (non-blocking until PVA-M4.10)"
      - name: Setup Node for local fixture regression
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Local analytics pointer fixture regression (no browser or network)
        run: timeout 10s node --test tests/fixtures/product-analytics-pointer.test.cjs
      - name: Tests
        run: uv run pytest -q -n auto
      - name: Contract artifacts are current
        run: uv run python -m contracts.export --check
      - name: Retrieval evaluation
        run: uv run python scripts/evaluate_retrieval.py
      - name: Conversation safety and guard evaluation (fixture)
        run: uv run python scripts/evaluate_conversations.py
      - name: Golden set replay (cassettes at the provider port, no network, 100% required)
        run: uv run python -m evals.runner golden --replay

  container:
    needs: [classify, static]
    if: ${{ !cancelled() && !failure() && needs.static.result == 'success' && contains(fromJSON(needs.classify.outputs.jobs), 'container') }}
    name: Container verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: pequeverso-assistant-api:smoke
      DOCKLE_VERSION: 0.4.15
      DOCKLE_SHA256: 8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad
      CST_VERSION: 1.22.1
      CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind reviewed source and configuration
        run: python3 -m scripts.ci_identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Lint the Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/app/Dockerfile
          config: .hadolint.yaml
          # The action exports its own threshold (default info) over the config file's value.
          failure-threshold: warning
      - name: Build exact application candidate (no publication)
        run: docker build -f infra/docker/app/Dockerfile --build-arg SERVICE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
      - name: Smoke the owned image and disposable SQLite fixture
        run: scripts/smoke_container.sh pequeverso-assistant-api:smoke
      - name: Image structure tests (container-structure-test)
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/container-structure-test"
          curl -fsSL -o "$tool" "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  $tool" | sha256sum -c -
          chmod +x "$tool"
          "$tool" test --image "$IMAGE" --config infra/docker/app/structure-test.yaml
      - name: Image CIS benchmark (dockle)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/dockle"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/dockle.tar.gz" "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz"
          echo "${DOCKLE_SHA256}  $dir/dockle.tar.gz" | sha256sum -c -
          tar -xzf "$dir/dockle.tar.gz" -C "$dir" dockle
          docker save "$IMAGE" -o "$dir/image.tar"
          # Fail on WARN or FATAL. Accepted, both inherited from the pinned official Python base:
          # CIS-DI-0008 (setuid/setgid files; the runtime is non-root with no-new-privileges,
          # scripts/smoke_container.sh) and DKL-DI-0005 (the base's own apt RUN keeps no cache we
          # can remove; our apt layer is checked by hadolint DL3009 above).
          "$dir/dockle" --input "$dir/image.tar" --exit-code 1 --exit-level warn \
            --ignore CIS-DI-0008 --ignore DKL-DI-0005
      - name: Software bill of materials (Syft, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pequeverso-assistant-api:smoke
          format: cyclonedx-json
          output-file: sbom-app-cyclonedx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-app-cyclonedx
          path: sbom-app-cyclonedx.json
          retention-days: 14
          if-no-files-found: error
      - name: Vulnerability scan (Grype, fixable High and Critical fail)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pequeverso-assistant-api:smoke
          config: .grype.yaml
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table
      - name: Reproducibility (same inputs build the same image twice)
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx create --name repro --driver docker-container --use >/dev/null
          for n in 1 2; do
            docker buildx build -f infra/docker/app/Dockerfile --no-cache --provenance=false --sbom=false \
              --build-arg SERVICE_REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH \
              --output "type=oci,dest=$RUNNER_TEMP/repro-$n.tar,rewrite-timestamp=true" .
          done
          python3 -m scripts.compare_oci_images "$RUNNER_TEMP/repro-1.tar" "$RUNNER_TEMP/repro-2.tar"
      - name: Record tested image identity
        run: python3 -m scripts.ci_identity --image pequeverso-assistant-api:smoke
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}


  database:
    needs: [classify, static]
    if: ${{ !cancelled() && !failure() && needs.static.result == 'success' && contains(fromJSON(needs.classify.outputs.jobs), 'database') }}
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind reviewed source and configuration
        run: python3 -m scripts.ci_identity
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .python-version
      - name: Install frozen service-test dependencies
        run: uv sync --frozen --no-build
      - name: Build exact project database candidates (no publication)
        id: images
        run: |
          docker build --build-arg SERVICE_REVISION="$GITHUB_SHA" -f infra/docker/postgres/Dockerfile -t pv-knowledge-pg:ci .
          docker build -f infra/docker/neo4j/Dockerfile -t pv-knowledge-neo:ci .
          echo "postgres=$(docker image inspect --format '{{.Id}}' pv-knowledge-pg:ci)" >> "$GITHUB_OUTPUT"
          echo "neo4j=$(docker image inspect --format '{{.Id}}' pv-knowledge-neo:ci)" >> "$GITHUB_OUTPUT"
      - name: PostgreSQL roles, indexing, private state, logging and restore
        env:
          PG_IMAGE: ${{ steps.images.outputs.postgres }}
        run: scripts/smoke_knowledge_postgres.sh "$PG_IMAGE" "$RUNNER_TEMP/knowledge-postgres"
      - name: Neo4j real paths, rollback and restored proof before reindex
        env:
          NEO_IMAGE: ${{ steps.images.outputs.neo4j }}
        run: |
          uv run python -m scripts.smoke_knowledge_neo4j \
            --image "$NEO_IMAGE" --receipt "$RUNNER_TEMP/knowledge-neo4j" \
            --private-dir "$RUNNER_TEMP/knowledge-private"
      - name: Actual session, HTTP/SSE, persistence and operator jobs on isolated stores
        env:
          PG_IMAGE: ${{ steps.images.outputs.postgres }}
          NEO_IMAGE: ${{ steps.images.outputs.neo4j }}
        run: |
          uv run python -m scripts.smoke_graph_runtime \
            --postgres-image "$PG_IMAGE" --neo4j-image "$NEO_IMAGE" \
            --receipt-dir "$RUNNER_TEMP/knowledge-http" --source-dir "$GITHUB_WORKSPACE" \
            --with-index-jobs --with-evaluation-tests

      - name: Record tested database image identities
        run: python3 -m scripts.ci_identity --image pv-knowledge-pg:ci --image pv-knowledge-neo:ci
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  ci-gate:
    if: always()
    needs: [classify, docs, security, workflows, secrets, static, database, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: gonzalomartinperez/engineering-standards/actions/ci-gate@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          expected: ${{ needs.classify.outputs.jobs }}

  # Temporary alias: the current ruleset still requires the context `checks`.
  checks:
    name: checks
    if: always()
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: ci-gate succeeded
        env:
          CI_GATE_RESULT: ${{ needs.ci-gate.result }}
        run: test "$CI_GATE_RESULT" = success
