name: Dependency policy

# Read-only assessment from the protected base commit. Every update is reviewed and merged
# manually. PR code is never checked out, installed or executed by this workflow.
# pull_request_target supplies authenticated metadata without granting a write token.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out or run
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    name: Evaluate eligibility
    # Routing filter only; the policy re-verifies identity (login, type, id), repository and commits.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
      automerge: ${{ steps.policy.outputs.automerge }}
    steps:
      - name: Checkout trusted policy (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/dependabot_policy.py
            .github/dependabot-policy.json
          sparse-checkout-cone-mode: false
      - name: Run policy
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/dependabot_policy.py --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
