# Private, project-isolated Community projection. No plugins, private messages or provider keys.
server.default_listen_address=0.0.0.0
server.bolt.enabled=true
server.http.enabled=true
# No admin Browser archive extraction or unmanaged extensions on a read-only root filesystem.
server.http_enabled_modules=TRANSACTIONAL_ENDPOINTS
server.https.enabled=false
server.directories.data=/data
server.directories.logs=/logs
server.directories.run=/var/lib/neo4j/run
server.memory.heap.initial_size=256m
server.memory.heap.max_size=256m
server.memory.pagecache.size=64m
server.jvm.additional=-XX:MaxDirectMemorySize=64m
server.jvm.additional=-Djna.boot.library.path=/opt/pv-native
server.jvm.additional=-Djna.nounpack=true
dbms.memory.transaction.total.max=64m
db.memory.transaction.max=16m
db.transaction.timeout=15s
db.shutdown_transaction_end_timeout=15s
dbms.security.auth_enabled=true
dbms.security.procedures.allowlist=
dbms.security.procedures.unrestricted=
db.logs.query.enabled=OFF
dbms.usage_report.enabled=false
