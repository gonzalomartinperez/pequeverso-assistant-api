<rect x="32" y="587" width="310" height="118" rx="16" fill="#162536" stroke="#42596e"/><rect x="48" y="604" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="62" y="622" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">PostgreSQL · public</text>
<text x="52" y="650" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">knowledge schema · pgvector</text>
<text x="52" y="674" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Immutable versions · active pointer</text>
<rect x="365" y="587" width="310" height="118" rx="16" fill="#162536" stroke="#42596e"/><rect x="381" y="604" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="395" y="622" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">Neo4j · public only</text>
<text x="385" y="650" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Rebuildable projection · 1–2 hops</text>
<text x="385" y="674" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">No visitor messages or identities</text>
<rect x="698" y="587" width="310" height="118" rx="16" fill="#162536" stroke="#42596e"/><rect x="714" y="604" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="728" y="622" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">PostgreSQL · private</text>
<text x="718" y="650" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Sessions · history · run lifecycle</text>
<text x="718" y="674" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Shared ledger · content-free metrics</text>
<text x="32" y="738" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Fixtures: SQLite baseline or PostgreSQL + hash64. Semantic profile: OpenAI embeddings.</text>
<text x="32" y="766" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">vps-ops owns deployment, HTTPS/SSE proxy, backups and shared OTel / Prometheus / Grafana.</text>
</svg>
