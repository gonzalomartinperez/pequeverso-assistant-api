<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc"><title id="title">Pequeverso assistant: public knowledge, private conversations</title><desc id="desc">Disabled storefront and private backoffice call a bounded API. PostgreSQL separates public catalog knowledge from private sessions and accounting; Neo4j is public-only. Authorized OpenAI embeddings and one generation are separately accounted. vps-ops owns deployment and shared observability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#748ca2"/></marker></defs><rect width="1040" height="800" rx="24" fill="#0e1726"/>
<text x="32" y="44" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="28" font-weight="700">Pequeverso · Assistant API</text>
<text x="32" y="74" fill="#c2d0de" font-family="Arial, sans-serif" font-size="16" font-weight="400">Implemented application boundaries · production activation remains blocked</text>
<rect x="32" y="105" width="475" height="110" rx="16" fill="#162536" stroke="#42596e"/><rect x="48" y="122" width="4" height="22" rx="2" fill="#ffb39d"/>
<text x="62" y="140" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">Native storefront · OFF</text>
<text x="52" y="168" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Spanish UI · safe rendering · conversation continuity</text>
<text x="52" y="192" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">No launcher, runtime load or assistant traffic when disabled</text>
<rect x="533" y="105" width="475" height="110" rx="16" fill="#162536" stroke="#42596e"/><rect x="549" y="122" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="563" y="140" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">Private backoffice</text>
<text x="553" y="168" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Separate PostgreSQL identity database</text>
<text x="553" y="192" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Server-only ops token · aggregate dashboard data</text>
<polyline points="450,215 450,250" fill="none" stroke="#748ca2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="960,215 960,250" fill="none" stroke="#748ca2" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="241" fill="#c2d0de" font-family="Arial, sans-serif" font-size="14" font-weight="400">Origin + cookie + CSRF + idempotency</text>
<text x="620" y="241" fill="#c2d0de" font-family="Arial, sans-serif" font-size="14" font-weight="400">Private /internal/v1/ops only</text>
<rect x="32" y="252" width="976" height="112" rx="16" fill="#162536" stroke="#42596e"/><rect x="48" y="269" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="62" y="287" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">HTTP boundary · /api/v1 + SSE</text>
<text x="52" y="315" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Sessions, availability, cancellation and authoritative saved history</text>
<text x="52" y="339" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">One instance / one worker · PostgreSQL ownership lease before recovery</text>
<polyline points="270,364 270,396" fill="none" stroke="#748ca2" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="770,364 770,396" fill="none" stroke="#748ca2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="398" width="475" height="139" rx="16" fill="#162536" stroke="#42596e"/><rect x="48" y="415" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="62" y="433" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">Retrieve · verify · pack</text>
<text x="52" y="461" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Finite LangGraph flow · no retries or checkpoints</text>
<text x="52" y="485" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Lexical + exact vector + bounded graph expansion</text>
<text x="52" y="509" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Version, hash, scope and provenance checks</text>
<rect x="533" y="398" width="475" height="139" rx="16" fill="#162536" stroke="#42596e"/><rect x="549" y="415" width="4" height="22" rx="2" fill="#44d7c4"/>
<text x="563" y="433" fill="#f3f6fa" font-family="Arial, sans-serif" font-size="18" font-weight="700">Generate · validate · persist</text>
<text x="553" y="461" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">At most one GPT-6 Luna generation · medium</text>
<text x="553" y="485" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Complete-prefix checks + canonical final answer</text>
<text x="553" y="509" fill="#c2d0de" font-family="Arial, sans-serif" font-size="15" font-weight="400">Generation and embeddings share the budget</text>
