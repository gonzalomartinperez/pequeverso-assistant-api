[project]
name = "pequeverso-assistant-api"
version = "1.0.0"
description = "Advisory, read-only shopping assistant backend for Pequeverso."
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core==1.7.6",
    "langgraph==1.2.21",
    "langsmith==0.14.17",
    "neo4j==6.4.1",
    "psycopg[binary,pool]==3.3.9",
    "psycopg-pool==3.3.3",
    "openai>=3.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "hypothesis>=6.140",
    "import-linter>=2.5",
    "jsonschema>=4.26.0",
    "mutmut>=3.8.1,<3.9",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "pytest-randomly>=5",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "schemathesis>=4.33.4",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0.20261006",
    "vulture>=2.14",
]

[tool.uv]
package = false

[tool.ruff]
# Legacy findings live in the ratchet base config; they may only shrink (scripts/ruff_ratchet.py).
extend = "ratchets/ruff-legacy.toml"
line-length = 100
# .claude/hooks: byte-matched copies from engineering-standards; docs/master-plan: planning artifacts.
extend-exclude = [".claude/hooks", "docs/master-plan", "mutants"]
target-version = "py314"
# Run by the CI runner's system python3 (Ubuntu 24.04: 3.12), not the uv venv:
# keep their syntax 3.12-compatible (tests/test_system_python_scripts.py).
per-file-target-version = { "scripts/{ci_identity,compare_oci_images,postgres_fixture_identity,container_fixture_probe,release_notes}.py" = "py312" }

[tool.ruff.lint]
# Ecosystem 10.2 families (never ALL). docs/master-plan/standards.md section 1.
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PERF", "PIE", "PT", "PTH", "TC", "ASYNC",
    "S", "T20", "TRY", "ARG", "FAST", "LOG", "G", "DTZ", "ERA", "FURB", "N", "RET", "D", "ANN",
]
ignore = ["E501", "TRY003", "D203", "D213"]

[tool.ruff.lint.extend-per-file-ignores]
# S2: public-API docstrings (D100-D107) are enforced only for the ports, the presentation layer
# and contracts; small typed internals elsewhere rely on names and types (standards.md S2).
"!{app/application/ports.py,app/application/knowledge_ports.py,app/presentation/**,contracts/**}" = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
# S4: tests use assert, synthetic secrets and untyped fixtures.
"tests/**" = ["S101", "ANN", "D", "ARG", "S105", "S106", "S311", "PT018"]
# S3: scripts are CLIs: print is the output, subprocess calls are fixed lists, sys.path bootstrap.
"scripts/**" = ["T201", "S603", "S607", "E402"]
# The evaluation runner is a CLI too: its JSON report goes to stdout.
"evals/runner.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "contracts", "scripts", "evals"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
# PVA-M2.3: branch coverage over the shipped packages (app, contracts; CLI and eval tooling are
# covered by their own tests but not floored); relative paths so the static and database
# jobs' data combine. `patch = ["subprocess"]` measures the real-service pytest the database job's
# smoke script starts.
branch = true
relative_files = true
parallel = true
source = ["app", "contracts"]
patch = ["subprocess"]

[tool.coverage.paths]
# Map the database job's subprocess paths onto the repository-relative names before combining.
app = ["app/", "*/app/"]
contracts = ["contracts/", "*/contracts/"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a paid provider; requires explicit authorization (never in CI)",
    "schemathesis: slow contract conformance suite; run in its own CI step, outside coverage",
    "unit: no external service; applied automatically by tests/conftest.py",
    "services: needs an explicitly isolated PostgreSQL or Neo4j fixture; applied automatically",
]
filterwarnings = [
    "error",
    # langsmith 0.14.x calls asyncio.iscoroutinefunction at import (removal slated for Python 3.16).
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
]

[tool.vulture]
paths = ["app", "contracts", "scripts", "ratchets/vulture-whitelist.py"]
min_confidence = 80

[tool.mutmut]
# Scoped modules from testing.md section 1 (mutmut 3.8 `source_paths`).
source_paths = [
    "app/domain/", # Includes budget.py; listing it twice races mutmut workers.
    "app/application/answers.py",
    "app/application/sessions.py",
    "app/ai/prompt.py",
    "app/ai/evidence.py",
    "app/ai/output.py",
    "app/application/embedding_budget.py",
]
# Copy package siblings and fixture assets so imports resolve inside mutants/.
also_copy = ["app", "catalog", "migrations", "contracts", "evals", "scripts", "docs/reference"]
process_isolation = "fork"
pytest_add_cli_args = ["-p", "no:randomly", "-x", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_domain.py",
    "tests/test_answers.py",
    "tests/test_language.py",
    "tests/test_page_claims.py",
    "tests/test_budget_concurrency.py",
    "tests/test_embedding_budget.py",
    "tests/test_api.py",
    "tests/test_output_parser.py",
    "tests/test_evidence_encoding.py",
    "tests/test_prompt_contract.py",
    "tests/test_properties_budget.py",
    "tests/test_properties_sessions.py",
    "tests/test_streaming.py",
    "tests/test_validated_stream.py",
    "tests/test_analytics_country.py",
    "tests/test_product_analytics.py",
    "tests/test_product_analytics_clock.py",
    "tests/test_visitor_context.py",
    "tests/test_knowledge_values.py",
    "tests/test_knowledge_seed_ranking.py",
    "tests/test_hybrid_knowledge.py",
    "tests/test_official_help.py",
    "tests/test_request_packing.py",
]
