[project]
name = "pequeverso-assistant-api"
version = "1.0.0"
description = "Advisory, read-only shopping assistant backend for Pequeverso."
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core==1.6.12",
    "langgraph==1.2.19",
    "langsmith==0.14.17",
    "neo4j==6.4.1",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "openai>=3.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
package = false

[tool.ruff]
# Legacy findings live in the ratchet base config; they may only shrink (scripts/ruff_ratchet.py).
extend = "ratchets/ruff-legacy.toml"
line-length = 100
# .claude/hooks: byte-matched copies from engineering-standards; docs/master-plan: planning artifacts.
extend-exclude = [".claude/hooks", "docs/master-plan"]
target-version = "py314"

[tool.ruff.lint]
# Ecosystem 10.2 families (never ALL). docs/master-plan/standards.md section 1.
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PERF", "PIE", "PT", "PTH", "TC", "ASYNC",
    "S", "T20", "TRY", "ARG", "FAST", "LOG", "G", "DTZ", "ERA", "FURB", "N", "RET", "D", "ANN",
]
ignore = ["E501", "TRY003", "D203", "D213"]

[tool.ruff.lint.extend-per-file-ignores]
# S2: public-API docstrings (D100-D107) are enforced only for the ports, the presentation layer
# and contracts; small typed internals elsewhere rely on names and types (standards.md S2).
"!{app/application/ports.py,app/application/knowledge_ports.py,app/presentation/**,contracts/**}" = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
# S4: tests use assert, synthetic secrets and untyped fixtures.
"tests/**" = ["S101", "ANN", "D", "ARG", "S105", "S106", "S311", "PT018"]
# S3: scripts are CLIs: print is the output, subprocess calls are fixed lists, sys.path bootstrap.
"scripts/**" = ["T201", "S603", "S607", "E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "contracts", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a paid provider; requires explicit authorization (never in CI)",
    "unit: no external service; applied automatically by tests/conftest.py",
    "services: needs an explicitly isolated PostgreSQL or Neo4j fixture; applied automatically",
]
filterwarnings = [
    "error",
    # langsmith 0.14.x calls asyncio.iscoroutinefunction at import (removal slated for Python 3.16).
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
]
