[project]
name = "pequeverso-assistant-api"
version = "1.0.0"
description = "Advisory, read-only shopping assistant backend for Pequeverso."
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core==1.6.12",
    "langgraph==1.2.16",
    "langsmith==0.14.9",
    "neo4j==6.4.1",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "openai>=3.33.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "B", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "contracts", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls a paid provider; requires explicit authorization (never in CI)"]
filterwarnings = ["error"]
